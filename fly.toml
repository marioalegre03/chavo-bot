# Chavo Bot — Fly.io config
# Bot de Telegram con polling: NO necesita puerto HTTP expuesto
app            = "chavo-bot"
primary_region = "dfw"   # Dallas — más cercano a México

[build]

# Sin [[services]] ni [[http_service]]
# El bot solo hace polling saliente a la API de Telegram
# El secret BOT_TOKEN se configura con:
#   fly secrets set BOT_TOKEN=tu_token
